name: Publish on approval

# The ONLY path that posts to Instagram. It runs when the repository owner
# comments /approve on an approval issue — never on a schedule, and never from
# anyone else's comment.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: dailyvolex-publish
  cancel-in-progress: false

jobs:
  publish:
    # Three gates, all required: an approval issue, the word /approve, and the
    # comment coming from the person who owns the repository. Without the last
    # one, anybody who can comment on an issue could publish to the account.
    if: >
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'awaiting-approval') &&
      startsWith(github.event.comment.body, '/approve') &&
      github.event.comment.user.login == github.repository_owner

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # What posts has to be what the issue showed, not whatever happens to be
      # in data/ when the approval arrives. The two are not the same thing:
      # the breaking watch rewrites data/ every fifteen minutes, so approving
      # an issue from an hour ago used to publish a different post entirely.
      # The images in the issue body are pinned to the commit they were
      # rendered at, so that commit is the one to read.
      - name: Find the commit this issue is showing
        id: pin
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const m = body.match(
              new RegExp(`raw\\.githubusercontent\\.com/${context.repo.owner}/${context.repo.repo}/([0-9a-f]{40})/`, 'i'));
            if (!m) core.setFailed('this issue does not pin a commit — refusing to guess what it meant');
            else { core.setOutput('sha', m[1]); core.notice(`approving the post rendered at ${m[1]}`); }

      - name: Check out exactly what was approved
        run: |
          git fetch --depth=1 origin "${{ steps.pin.outputs.sha }}"
          git checkout "${{ steps.pin.outputs.sha }}" -- data/

      - name: Confirm there is something approved to post
        id: find
        env:
          SHA: ${{ steps.pin.outputs.sha }}
        run: |
          test -f data/shortlist.json || { echo "no shortlist"; exit 1; }
          IMAGES=$(node -e "
            const s=require('./data/shortlist.json');
            const e=(s.output||s.stories)[0];
            process.stdout.write((e.images||[e.image]).filter(Boolean).join(','))")
          test -n "$IMAGES" || { echo "no rendered image"; exit 1; }
          for f in ${IMAGES//,/ }; do test -f "$f" || { echo "$f missing"; exit 1; }; done
          URLS=""
          for f in ${IMAGES//,/ }; do
            URLS="${URLS:+$URLS,}https://raw.githubusercontent.com/${GITHUB_REPOSITORY}/${SHA}/${f}"
          done
          echo "urls=$URLS" >> "$GITHUB_OUTPUT"

      - name: Post to Instagram
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: |
          node automation/publish.mjs \
            --images "${{ steps.find.outputs.urls }}" \
            --caption-file data/pending/caption-1.txt

      - name: Remember what was posted, so it never comes round again
        run: |
          node -e "
            const fs=require('fs');
            const s=JSON.parse(fs.readFileSync('data/shortlist.json','utf8'));
            const e=(s.output||s.stories)[0];
            const items=(e.stories||[e]).map(x=>({
              title:x.original||x.headline, link:x.link||null, posted:new Date().toISOString() }));
            const p=fs.existsSync('data/posted.json')
              ? JSON.parse(fs.readFileSync('data/posted.json','utf8')) : {posted:[]};
            p.posted=[...items,...(p.posted||[])].slice(0,400);
            p.updated=new Date().toISOString();
            fs.writeFileSync('data/posted.json', JSON.stringify(p,null,2)+'\n');
          "
          git config user.name  "dailyvolex-bot"
          git config user.email "noreply@github.com"
          git add data/posted.json
          git commit -m "Posted $(date -u +%Y-%m-%d)" || echo "nothing changed"
          git push

      - name: Say so on the issue and close it
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? '✅ Posted to Instagram.'
                : `❌ Publishing failed — see [the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}). Nothing was posted.`,
            });
            if (ok) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed',
              });
            }
