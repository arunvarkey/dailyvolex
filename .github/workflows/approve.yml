name: Publish on approval

# The ONLY path that posts to Instagram. It runs when the repository OWNER
# approves — never on a schedule, and never from anyone else.
#
# Two ways to approve, both the owner's:
#   · comment  /approve top reel  on the approval issue
#   · open an issue titled  /approve top reel  — which is what the Approve
#     button in the app does, because a static page cannot hold a credential
#     and GitHub will prefill a new issue from a link. Two taps, no typing,
#     and the gate is the same one.

on:
  issue_comment:
    types: [created]
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: dailyvolex-publish
  cancel-in-progress: false

jobs:
  publish:
    # The owner, and the word /approve. For a comment, also an open approval
    # issue — without that gate anybody who can comment could publish to the
    # account. For a new issue, authorship IS the gate: only the owner can
    # open an issue that this will act on.
    if: >
      (github.event_name == 'issue_comment' &&
       github.event.issue.state == 'open' &&
       contains(github.event.issue.labels.*.name, 'awaiting-approval') &&
       startsWith(github.event.comment.body, '/approve') &&
       github.event.comment.user.login == github.repository_owner)
      ||
      (github.event_name == 'issues' &&
       startsWith(github.event.issue.title, '/approve') &&
       github.event.issue.user.login == github.repository_owner)

    runs-on: ubuntu-latest
    # A reel container is transcoded by Meta before it can be published,
    # which takes minutes rather than seconds. Ten was sized for images.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          # The whole history, so the commit an edition was published at can
          # be found from the edition itself. It is 1.2 MB since the prune.
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # What posts has to be what was offered, not whatever is newest. A
      # re-run can rebuild the same edition id with different stories — this
      # morning's did — so the commit matters as well as the id.
      #
      # A comment carries both in its image URLs. A new issue from the app
      # carries only the id, and the commit is found from it: the last commit
      # that touched that edition's directory is the one it was offered at.
      - name: Work out what is being approved
        id: pin
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const byComment = context.eventName === 'issue_comment';
            const words = byComment
              ? context.payload.comment.body
              : context.payload.issue.title;

            let sha = '', edition = '';
            if (byComment) {
              const body = context.payload.issue.body || '';
              const m = body.match(new RegExp(
                `raw\\.githubusercontent\\.com/${context.repo.owner}/${context.repo.repo}`
                + `/([0-9a-f]{40})/data/editions/([A-Za-z0-9_.-]+)/`, 'i'));
              if (!m) return core.setFailed(
                'this issue does not name a commit and an edition — refusing to guess what it meant');
              sha = m[1];
              edition = m[2];
            } else {
              const m = (context.payload.issue.body || '').match(/edition:\s*([A-Za-z0-9_.-]+)/i);
              if (!m) return core.setFailed(
                'this approval names no edition — the app fills that in, so it was written by hand');
              edition = m[1];
            }

            // Never through a shell: a person wrote these words.
            fs.mkdirSync('work', { recursive: true });
            fs.writeFileSync('work/comment.txt', words, 'utf8');

            core.setOutput('sha', sha);
            core.setOutput('edition', edition);
            core.notice(`approving ${edition}${sha ? ` as offered at ${sha}` : ''}: ${words.trim()}`);

      # When the approval named a commit, take data/ from it. When it came
      # from the app it named only the edition, so find the commit that last
      # touched that edition's directory — that is the one it was offered at,
      # and it is exact rather than "whatever is newest".
      - name: Check out exactly what was approved
        id: at
        env:
          SHA: ${{ steps.pin.outputs.sha }}
          EDITION: ${{ steps.pin.outputs.edition }}
        run: |
          set -e
          if [ -z "$SHA" ]; then
            SHA=$(git log -1 --format=%H -- "data/editions/$EDITION")
            [ -n "$SHA" ] || { echo "no commit has ever carried edition $EDITION"; exit 1; }
            echo "edition $EDITION was offered at $SHA"
          fi
          git checkout "$SHA" -- data/
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"

      # What `/approve top business` means is decided by automation/lib/plan.mjs,
      # which is pure and tested directly. It used to live in this file, where
      # it could not be run anywhere but GitHub and was tested by evaluating
      # JavaScript out of a YAML string — and a bug in it does not fail
      # loudly, it posts the wrong thing under the channel's name.
      - name: Work out what was approved
        id: plan
        run: |
          node automation/dv.mjs plan \
            --comment-file work/comment.txt \
            --edition "${{ steps.pin.outputs.edition }}" \
            --sha "${{ steps.at.outputs.sha }}" \
            --out work/plan.json
          node -e "
            const p = require('./work/plan.json');
            console.log('labels=' + p.labels);
          " >> "$GITHUB_OUTPUT"

      - name: Post to Instagram
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: node automation/publish.mjs --plan work/plan.json

      # The record outlives the day: the next run reads it to avoid
      # repeating a story, and a correction reads it to find the media id of
      # the post it has to be attached to. Decided by lib/ledger.mjs, which
      # is pure and tested — it was forty lines of JavaScript inside a shell
      # string inside this file.
      - name: Remember what was posted, so it never comes round again
        run: |
          # The pinned checkout replaced data/ wholesale, the ledger
          # included. That file is the running record and may have gained
          # entries since, so take the current one back before adding to it.
          git checkout HEAD -- data/ledger.json 2>/dev/null || true
          node automation/dv.mjs record --issue "${{ github.event.issue.number }}" \
            --edition "${{ steps.pin.outputs.edition }}"
          automation/push-data.sh "Posted $(date -u +%Y-%m-%d)" data/ledger.json

      - name: Say so on the issue and close it
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const what = `${{ steps.plan.outputs.labels }}` || 'the post';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `✅ Posted to Instagram: **${what}**.`
                : `❌ Publishing failed — see [the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
                  + ` Any section already posted before the failure stayed posted; the rest did not go out.`,
            });
            if (ok) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed',
              });
            }
