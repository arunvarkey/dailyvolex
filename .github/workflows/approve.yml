name: Publish on approval

# The ONLY path that posts to Instagram. It runs when the repository owner
# comments /approve on an approval issue — never on a schedule, and never from
# anyone else's comment.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write

concurrency:
  group: dailyvolex-publish
  cancel-in-progress: false

jobs:
  publish:
    # Three gates, all required: an approval issue, the word /approve, and the
    # comment coming from the person who owns the repository. Without the last
    # one, anybody who can comment on an issue could publish to the account.
    if: >
      github.event.issue.state == 'open' &&
      contains(github.event.issue.labels.*.name, 'awaiting-approval') &&
      startsWith(github.event.comment.body, '/approve') &&
      github.event.comment.user.login == github.repository_owner

    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # What posts has to be what the issue showed, not whatever happens to be
      # in data/ when the approval arrives. The two are not the same thing:
      # the breaking watch rewrites data/ every fifteen minutes, so approving
      # an issue from an hour ago used to publish a different post entirely.
      # The images in the issue body are pinned to the commit they were
      # rendered at, so that commit is the one to read.
      - name: Find the commit this issue is showing
        id: pin
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || '';
            const m = body.match(
              new RegExp(`raw\\.githubusercontent\\.com/${context.repo.owner}/${context.repo.repo}/([0-9a-f]{40})/`, 'i'));
            if (!m) core.setFailed('this issue does not pin a commit — refusing to guess what it meant');
            else { core.setOutput('sha', m[1]); core.notice(`approving the post rendered at ${m[1]}`); }

      - name: Check out exactly what was approved
        run: |
          git fetch --depth=1 origin "${{ steps.pin.outputs.sha }}"
          git checkout "${{ steps.pin.outputs.sha }}" -- data/

      # "/approve top business" posts those two sections and nothing else.
      # Naming nothing posts Top stories only — the conservative reading of an
      # ambiguous approval, and what the command used to mean.
      - name: Work out which sections were approved
        id: plan
        env:
          SHA: ${{ steps.pin.outputs.sha }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sl = JSON.parse(fs.readFileSync('data/shortlist.json', 'utf8'));
            const out = sl.output || sl.stories || [];
            if (!out.length) return core.setFailed('nothing rendered to post');

            const asked = (context.payload.comment.body || '')
              .replace(/^\s*\/approve/i, '').trim().toLowerCase()
              .split(/[\s,]+/).filter(Boolean);

            const sectioned = out.some(e => e.section);
            let chosen;
            if (!sectioned)                chosen = [out[0]];
            else if (asked.includes('all')) chosen = out;
            else if (!asked.length)         chosen = out.filter(e => e.section === 'top');
            else {
              const unknown = asked.filter(a => !out.some(e => e.section === a));
              if (unknown.length) return core.setFailed(
                `no such section: ${unknown.join(', ')} — this post has `
                + out.map(e => e.section).join(', '));
              chosen = asked.map(a => out.find(e => e.section === a));
            }
            if (!chosen.length) return core.setFailed('nothing matched that approval');

            const sha = process.env.SHA;
            const plan = chosen.map(e => {
              const files = (e.images || [e.image]).filter(Boolean);
              for (const f of files)
                if (!fs.existsSync(f)) throw new Error(`${f} is missing at ${sha}`);
              const caption = e.section
                ? `data/pending/caption-${e.section}.txt`
                : 'data/pending/caption-1.txt';
              if (!fs.existsSync(caption)) throw new Error(`${caption} is missing at ${sha}`);
              // A correction is attached to the post it corrects, so whoever
              // finds the mistake finds the correction with it.
              const story = (e.stories || [e])[0] || {};
              return {
                section: e.section || 'post',
                label: e.sectionLabel || (e.kind === 'correction' ? 'Correction' : 'Post'),
                caption,
                // Descriptions for blind readers, written beside the slides.
                alts: e.altFile && fs.existsSync(e.altFile) ? e.altFile : '',
                commentOn: story.corrects?.mediaId || '',
                urls: files.map(f =>
                  `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${sha}/${f}`).join(','),
              };
            });
            core.notice(`posting: ${plan.map(p => p.label).join(', ')}`);
            core.setOutput('plan', JSON.stringify(plan));
            core.setOutput('labels', plan.map(p => p.label).join(', '));

      - name: Post to Instagram
        env:
          IG_USER_ID:      ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          PLAN:            ${{ steps.plan.outputs.plan }}
        run: |
          # One Instagram post per approved section, in the order asked for.
          # A failure part-way through stops the rest: half a morning posted is
          # recoverable, but carrying on past an error is how the same post
          # goes out twice.
          echo "$PLAN" | node -e "
            let d=''; process.stdin.on('data',c=>d+=c).on('end',()=>{
              const plan=JSON.parse(d);
              console.log(plan.map(p=>[p.section,p.urls,p.caption,p.commentOn||'',p.alts||''].join('\t')).join('\n'));
            })" > plan.tsv
          while IFS=$'\t' read -r SECTION URLS CAPTION COMMENT_ON ALTS; do
            [ -n "$SECTION" ] || continue
            echo "── posting $SECTION ──"
            EXTRA=""
            if [ -n "$COMMENT_ON" ] && [ -f data/pending/correction-comment.txt ]; then
              EXTRA="--comment-on $COMMENT_ON --comment-file data/pending/correction-comment.txt"
            fi
            [ -n "$ALTS" ] && EXTRA="$EXTRA --alt-file $ALTS"
            node automation/publish.mjs --images "$URLS" --caption-file "$CAPTION" \
              --section "$SECTION" $EXTRA
          done < plan.tsv
          rm -f plan.tsv

      - name: Remember what was posted, so it never comes round again
        env:
          PLAN: ${{ steps.plan.outputs.plan }}
          ISSUE: ${{ github.event.issue.number }}
        run: |
          # The pinned checkout replaced data/ wholesale, posted.json included.
          # That file is the running record and may have gained entries since,
          # so take the current one back before adding to it.
          git checkout HEAD -- data/posted.json 2>/dev/null || true
          # Only the sections that were actually approved. Recording the whole
          # shortlist would bury the sections the owner chose NOT to post, and
          # they should be free to come back tomorrow.
          node -e "
            const fs=require('fs');
            const s=JSON.parse(fs.readFileSync('data/shortlist.json','utf8'));
            const out=s.output||s.stories||[];
            const wanted=new Set(JSON.parse(process.env.PLAN).map(p=>p.section));
            const chosen=out.filter(e=>wanted.has(e.section||'post'));
            const now=new Date().toISOString();
            // What publish.mjs actually got back from Instagram: the media id
            // and permalink per section. Without these a correction has
            // nothing to point at.
            let published=[];
            try { published=JSON.parse(fs.readFileSync('data/pending/published.json','utf8')); } catch {}
            const bySection=new Map(published.map(p=>[p.section,p]));

            const items=chosen.flatMap(e=>{
              const meta=bySection.get(e.section||'post')||{};
              return (e.stories||[e]).map(x=>({
                title:x.original||x.headline, link:x.link||null,
                section:e.section||null, issue:Number(process.env.ISSUE),
                mediaId:meta.mediaId||null, permalink:meta.permalink||null,
                kind:e.kind||null, posted:now }));
            });

            const p=fs.existsSync('data/posted.json')
              ? JSON.parse(fs.readFileSync('data/posted.json','utf8')) : {posted:[]};

            // Mark the corrected post in the record. A correction that is not
            // visible in the history is a correction only the reader knows
            // about, and the history is what the next run checks.
            for (const e of chosen) {
              const id=(e.stories||[e])[0]?.corrects?.mediaId;
              if (!id) continue;
              for (const rec of (p.posted||[])) {
                if (rec.mediaId===id) { rec.corrected=now; rec.correctedBy=Number(process.env.ISSUE); }
              }
            }

            p.posted=[...items,...(p.posted||[])].slice(0,400);
            p.updated=now;
            fs.writeFileSync('data/posted.json', JSON.stringify(p,null,2)+'\n');
            console.log('recorded '+items.length+' story/stories');
          "
          automation/push-data.sh "Posted $(date -u +%Y-%m-%d)" data/posted.json

      - name: Say so on the issue and close it
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const ok = '${{ job.status }}' === 'success';
            const what = `${{ steps.plan.outputs.labels }}` || 'the post';
            await github.rest.issues.createComment({
              owner: context.repo.owner, repo: context.repo.repo,
              issue_number: context.issue.number,
              body: ok
                ? `✅ Posted to Instagram: **${what}**.`
                : `❌ Publishing failed — see [the run](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}).`
                  + ` Any section already posted before the failure stayed posted; the rest did not go out.`,
            });
            if (ok) {
              await github.rest.issues.update({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, state: 'closed',
              });
            }
