name: Daily shortlist

# Builds the day's graphic and opens an issue asking for approval.
# Posts NOTHING. Publishing happens only from approve.yml, after a human says so.

on:
  schedule:
    - cron: '30 2 * * *'      # 08:00 IST

  # Touch .github/run-now and push to make a post on demand. The Actions
  # "Run workflow" button needs a session that can dispatch workflows; a commit
  # is something anyone with push access can do, from a phone included.
  push:
    paths: ['.github/run-now']

  workflow_dispatch:
    inputs:
      count:
        description: 'How many stories to shortlist'
        default: '3'

permissions:
  contents: write           # commit the shortlist and the rendered graphic
  issues: write             # open the approval issue
  actions: read             # name the step that failed, in the report

concurrency:
  group: dailyvolex-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Sections multiplied the work: one carousel became up to seven, each a
    # cover plus a card per story, each card its own headless Chrome and its
    # own image search. Fifteen minutes was sized for a single carousel.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pick today's stories
        run: node automation/shortlist.mjs --count "${{ inputs.count || '3' }}"

      - name: Draw the cards
        run: node automation/render.mjs --ratio 4:5

      - name: Write a caption for every section
        run: node automation/caption.mjs --all

      # The history keeps every edition regardless — an approved post has to
      # stay fetchable from the commit it was pinned to — but a fresh
      # checkout has no use for three months of slides.
      - name: Keep the working tree to the last ten editions
        run: node automation/dv.mjs prune

      # A reel reaches people a carousel does not. Never required: a day with
      # no reel is a day with a carousel, which is the post that matters, so
      # an ffmpeg problem must not cost the run.
      - name: Build a reel of the top stories
        continue-on-error: true
        run: |
          # apt-get update first, or the install 404s on a runner whose
          # package lists point at versions that have since been superseded —
          # which is exactly what it did when this was first tried by hand.
          if ! ffmpeg -version >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ffmpeg
          fi
          ffmpeg -version | head -1
          node automation/reel.mjs --section top

      - name: Publish the graphic so Instagram can fetch it
        # Instagram pulls the image from a public URL rather than accepting an
        # upload, so the file has to be reachable before it can be posted.
        run: automation/push-data.sh "Shortlist for $(date -u +%Y-%m-%d)"

      # The issue body is decided by automation/lib/offer.mjs, which is pure
      # and tested. This step only hands the result to the API: a workflow
      # that decides something is a decision nobody can run on a laptop, and
      # every expensive bug in this repo's history was in that layer.
      - name: Write the approval issue
        run: node automation/dv.mjs offer --sha "$GITHUB_SHA" --out work/issue.json

      - name: Ask for approval
        uses: actions/github-script@v7
        with:
          script: |
            const issue = require(`${process.env.GITHUB_WORKSPACE}/work/issue.json`);
            await github.rest.issues.create({ ...context.repo, ...issue });

      # Unattended automation that fails quietly is not automation. Runs on
      # success too, so the issue closes itself when things recover.
      - name: Report the run
        if: always()
        # The reporter must not be able to fail the run it is reporting on.
        # A typo in it marked a wholly successful run as failed, which is
        # precisely the confusion it exists to remove.
        continue-on-error: true
        uses: ./.github/actions/report-run
        with:
          status: ${{ job.status }}
          token: ${{ secrets.GITHUB_TOKEN }}
          note: 'No post was offered for approval today.'
