name: Daily shortlist

# Builds the day's graphic and opens an issue asking for approval.
# Posts NOTHING. Publishing happens only from approve.yml, after a human says so.

on:
  schedule:
    - cron: '30 2 * * *'      # 08:00 IST

  # Touch .github/run-now and push to make a post on demand. The Actions
  # "Run workflow" button needs a session that can dispatch workflows; a commit
  # is something anyone with push access can do, from a phone included.
  push:
    paths: ['.github/run-now']

  workflow_dispatch:
    inputs:
      format:
        description: 'What to make'
        type: choice
        default: sections
        options: [sections, carousel, digest, cards]
      count:
        description: 'How many stories to shortlist'
        default: '3'

permissions:
  contents: write           # commit the shortlist and the rendered graphic
  issues: write             # open the approval issue

concurrency:
  group: dailyvolex-daily
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    # Sections multiplied the work: one carousel became up to seven, each a
    # cover plus a card per story, each card its own headless Chrome and its
    # own image search. Fifteen minutes was sized for a single carousel.
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Pick today's stories
        run: node automation/shortlist.mjs --count "${{ inputs.count || '3' }}"

      - name: Render a post per section
        env:
          FORMAT: ${{ inputs.format || 'sections' }}
        run: |
          case "$FORMAT" in
            digest)   FLAG=--digest ;;
            cards)    FLAG= ;;
            carousel) FLAG=--carousel ;;
            *)        FLAG=--sections ;;
          esac
          node automation/render.mjs $FLAG --ratio 4:5

      - name: Write a caption for every section
        run: node automation/caption.mjs --all

      - name: Publish the graphic so Instagram can fetch it
        # Instagram pulls the image from a public URL rather than accepting an
        # upload, so the file has to be reachable before it can be posted.
        run: |
          git config user.name  "dailyvolex-bot"
          git config user.email "noreply@github.com"
          git add data/
          git commit -m "Shortlist for $(date -u +%Y-%m-%d)" || echo "nothing changed"
          git push

      - name: Ask for approval
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const sl = JSON.parse(fs.readFileSync('data/shortlist.json', 'utf8'));
            const out = sl.output || sl.stories || [];
            const sha = process.env.GITHUB_SHA;
            const raw = p => `https://raw.githubusercontent.com/${context.repo.owner}/${context.repo.repo}/${sha}/${p}`;

            const warnings = [];
            if (sl.feedErrors?.length) warnings.push(`Feeds that failed: ${sl.feedErrors.join('; ')}`);

            // One block per section. Each is a separate post, and each is
            // posted only if named — so the summary has to make it obvious
            // what the words after /approve do.
            const blocks = out.map(entry => {
              const id = entry.section || 'post';
              const label = entry.sectionLabel || 'POST';
              const slides = (entry.images || [entry.image]).filter(Boolean);
              const stories = (entry.stories || [entry]);
              const captionFile = entry.section
                ? `data/pending/caption-${entry.section}.txt`
                : 'data/pending/caption-1.txt';
              const caption = fs.existsSync(captionFile)
                ? fs.readFileSync(captionFile, 'utf8').trim() : '(no caption)';

              for (const s of stories) {
                if (s.corroboration < 2)
                  warnings.push(`${label}: "${(s.display || '').slice(0, 44)}…" has only ONE newsroom behind it.`);
                if (s.republishers?.length)
                  warnings.push(`${label}: also carried by ${s.republishers.join(', ')} — not counted as corroboration.`);
                // Who owns the newsrooms that agree with each other.
                for (const c of (s.concentration || []))
                  warnings.push(`${label}: ${c}`);
                if (s.photoError)
                  warnings.push(`${label}: no photo for "${(s.display || '').slice(0, 36)}…" — ${s.photoError}`);
              }

              return [
                `<details${id === 'top' ? ' open' : ''}>`,
                `<summary><b>${label}</b> — ${stories.length} stor${stories.length === 1 ? 'y' : 'ies'},`
                  + ` ${slides.length} slides · post with <code>/approve ${id}</code></summary>`,
                '',
                slides.map((p, i) => `![${id} slide ${i + 1}](${raw(p)})`).join('\n'),
                '',
                stories.map(s =>
                  `- ${s.tier ? `\`${s.tier}\` ` : ''}**${s.display || s.headline}**\n  _${s.source}_ · `
                  + `${s.corroboration} independent newsroom${s.corroboration > 1 ? 's' : ''}`
                  + (s.ownerCount ? `, ${s.ownerCount} owner${s.ownerCount > 1 ? 's' : ''}` : '')
                  + (s.countries?.length ? ` (${s.countries.join('/')})` : '')
                  + (s.truncated ? ' · shortened to fit' : '')
                  + (s.link ? `\n  ${s.link}` : '')).join('\n'),
                '',
                '**Caption**', '```', caption, '```',
                '</details>',
              ].join('\n');
            });

            const menu = out.map(e =>
              `- \`${e.section || 'post'}\` — **${e.sectionLabel || 'POST'}**`
              + ` (${(e.stories || [e]).length} stories)`).join('\n');

            const body = [
              `**${out.length} post${out.length === 1 ? '' : 's'} ready.** Nothing goes out unless you name it.`,
              '', menu, '',
              '---', '',
              blocks.join('\n\n'),
              warnings.length ? `\n### ⚠️ Check\n${warnings.map(w => `- ${w}`).join('\n')}` : '',
              '',
              '---',
              '**To post, comment** `/approve <section> <section>` — for example `/approve top business`.',
              '`/approve all` posts every section. A bare `/approve` posts Top stories only.',
              'Anything else, or no reply, and nothing is posted. Close this issue to discard it.',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Approve post — ${new Date().toISOString().slice(0, 10)}`,
              body,
              labels: ['awaiting-approval'],
            });
