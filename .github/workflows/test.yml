name: Tests

# Runs on every change. The pipeline is unattended, so a regression that only
# shows up at 08:00 the next morning is a regression nobody sees coming.

on:
  push:
    branches: [main]
    paths: ['automation/**', 'index.html', '.github/workflows/**', 'package.json']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - run: npm install --no-audit --no-fund

      - name: Logic and token tests
        run: npm test

      - name: Render from fixtures, then test the workflows themselves
        # Uses saved feeds, so this never depends on a news site being up.
        # The strict variant fails if the brand typeface did not load, which is
        # the only place that can actually be checked.
        run: |
          npm run build:sample:strict
          node automation/test-workflows.mjs

      - name: Check the graphics actually came out
        # Finding none at all is a failure in its own right rather than a
        # quietly empty loop — which is what it was when sections moved the
        # slides and the old top-level glob stopped matching anything.
        # Slides are JPEG: a card is type over a gradient or a photograph,
        # which is what JPEG is for, and as PNG the same fifteen slides came
        # to 10.5 MB against 1.6 MB.
        run: |
          COUNT=0
          while IFS= read -r f; do
            SIZE=$(stat -c%s "$f")
            test "$SIZE" -gt 8000 || { echo "$f is suspiciously small ($SIZE bytes)"; exit 1; }
            echo "ok  $f  $((SIZE/1024)) KB"
            COUNT=$((COUNT + 1))
          done < <(find data/editions -name 'slide-*.jpg' | sort)
          test "$COUNT" -gt 0 || { echo "no graphics were rendered at all"; exit 1; }
          echo "$COUNT graphic(s) checked"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: sample-graphics
          path: data/editions/
          retention-days: 7
